<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICT Sniper - Premium Trading App</title>
  <!-- Tailwind CSS CDN für modernes Design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Glassmorphism Styles */
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 1rem;
    }

    .glass-card-accent {
      background: rgba(234, 179, 8, 0.05);
      border: 1px solid rgba(234, 179, 8, 0.2);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.2s ease;
    }

    .glass-input:focus {
      border-color: #eab308;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
      outline: none;
    }

    .glow-gold {
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
    }
  </style>
</head>
<body class="pb-24 pt-4 px-3 sm:px-6">

  <!-- Header & Navigation -->
  <header class="max-w-xl mx-auto mb-5">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-yellow-400 to-amber-200 bg-clip-text text-transparent">
        ICT Sniper
      </h1>
      <span class="text-xs px-2.5 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 font-medium">
        v2.0 Glass Edition
      </span>
    </div>

    <!-- Tabs -->
    <nav class="grid grid-cols-3 gap-1.5 p-1 glass-card rounded-xl text-center text-xs font-medium">
      <button class="py-2.5 rounded-lg bg-yellow-500 text-slate-950 font-bold shadow-md transition">
        Challenge & Analyse
      </button>
      <button class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">
        Historie / Journal
      </button>
      <button class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">
        Einstellungen
      </button>
    </nav>
  </header>

  <main class="max-w-xl mx-auto space-y-4">

    <!-- 12-Tage-Challenge Card (Kompakt) -->
    <section class="glass-card p-4 glow-gold relative overflow-hidden">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="text-xs uppercase font-bold tracking-wider text-yellow-500">12-Tage-Challenge</span>
          <div class="text-2xl font-black text-white mt-0.5">
            668 € <span class="text-sm font-normal text-slate-400">von 25.000 €</span>
          </div>
        </div>
        <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
          Tag 1 von 12
        </span>
      </div>

      <!-- Fortschrittsbalken -->
      <div class="w-full bg-slate-800 rounded-full h-2 mb-3 overflow-hidden border border-slate-700">
        <div class="bg-gradient-to-r from-yellow-500 to-amber-300 h-2 rounded-full" style="width: 2.67%"></div>
      </div>

      <!-- Schnell-Felder -->
      <div class="grid grid-cols-2 gap-2 mt-3">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">Startkapital (€)</label>
          <input type="number" value="1000" class="w-full glass-input rounded-lg px-3 py-1.5 text-sm font-medium">
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">Aktuell (€)</label>
          <input type="number" value="668" class="w-full glass-input rounded-lg px-3 py-1.5 text-sm font-medium">
        </div>
      </div>
    </section>

    <!-- Session & Killzone Status -->
    <section class="glass-card p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="text-lg font-bold text-white tracking-wide" id="live-time">19:27:31</div>
        <div class="flex gap-2 text-xs font-medium text-slate-400">
          <span>London <span class="text-emerald-400">●</span></span>
          <span>NY <span class="text-emerald-400">●</span></span>
          <span>Tokio <span class="text-slate-600">○</span></span>
        </div>
      </div>

      <!-- Killzone Warning Badge -->
      <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs flex items-center gap-2.5">
        <span class="text-base">🔴</span>
        <div>
          <div class="font-bold">Außerhalb der Killzone / Ruhige Phase</div>
          <div class="text-[11px] text-red-300/80 mt-0.5">Erhöhtes Fakeout-Risiko – Trade nicht empfohlen. Nächste Killzone: Do 09:00 Uhr</div>
        </div>
      </div>
    </section>

    <!-- Trading-Parameter & Chart-Upload -->
    <section class="glass-card p-4 space-y-3">
      <span class="text-xs uppercase font-bold tracking-wider text-slate-400 block mb-1">Asset & Parameter</span>
      
      <!-- Asset Selector Buttons -->
      <div class="grid grid-cols-3 gap-2">
        <button class="py-2 px-3 rounded-lg text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/40">Gold (XAU)</button>
        <button class="py-2 px-3 rounded-lg text-xs font-medium glass-input text-slate-300 hover:text-white">Bitcoin</button>
        <button class="py-2 px-3 rounded-lg text-xs font-medium glass-input text-slate-300 hover:text-white">Brent Oil</button>
      </div>

      <!-- Parameter Grid (Kompakt nebeneinander) -->
      <div class="grid grid-cols-3 gap-2 pt-2">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Kontostand (€)</label>
          <input type="number" value="668" class="w-full glass-input rounded-lg px-2.5 py-1.5 text-xs">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">EUR/USD</label>
          <input type="number" value="1.12" step="0.01" class="w-full glass-input rounded-lg px-2.5 py-1.5 text-xs">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Spread</label>
          <input type="number" value="100" class="w-full glass-input rounded-lg px-2.5 py-1.5 text-xs">
        </div>
      </div>

      <!-- Chart Uploads -->
      <div class="grid grid-cols-2 gap-2 pt-2">
        <button class="p-3 rounded-xl border border-dashed border-slate-600 hover:border-yellow-500/50 text-slate-400 text-xs flex flex-col items-center justify-center gap-1 transition">
          <span>📷 M5-Chart wählen</span>
          <span class="text-[9px] text-slate-500">Überblick & Bias</span>
        </button>
        <button class="p-3 rounded-xl border border-dashed border-slate-600 hover:border-yellow-500/50 text-slate-400 text-xs flex flex-col items-center justify-center gap-1 transition">
          <span>🎯 M1-Chart wählen</span>
          <span class="text-[9px] text-slate-500">Entry, SL, TP</span>
        </button>
      </div>

      <!-- Main Action Button -->
      <button class="w-full py-3.5 rounded-xl bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black text-sm uppercase tracking-wider shadow-lg hover:brightness-110 active:scale-[0.99] transition mt-2">
        Trade Card erstellen
      </button>
    </section>

  </main>

  <!-- Fixierter Mobile Floating Bar unten -->
  <div class="fixed bottom-3 left-0 right-0 px-4 max-w-xl mx-auto pointer-events-none">
    <div class="glass-card p-2 backdrop-blur-xl border border-white/10 rounded-2xl flex justify-between items-center shadow-2xl pointer-events-auto">
      <div class="px-3 text-xs">
        <span class="text-slate-400">Status:</span> 
        <span class="text-emerald-400 font-semibold ml-1">Bereit</span>
      </div>
      <button class="px-4 py-2 rounded-xl bg-yellow-500 text-slate-950 font-bold text-xs shadow-md hover:bg-yellow-400 transition">
        ⚡ Schnellanalyse
      </button>
    </div>
  </div>

</body>
</html>
